{% extends "base.html" %}
{% block title %}500 - Server Error{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="badge bg-danger p-3 rounded-circle mb-3"><i class="bi bi-exclamation-triangle fs-1"></i></div>
    <h2 class="fw-bold">500 - Internal Server Error</h2>
    <p class="text-muted">An unexpected database or processing error occurred. The transaction has been safely rolled back.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i> Return Home</a>
  </div>
</div>
{% endblock %}
