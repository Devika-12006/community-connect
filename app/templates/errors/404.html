{% extends "base.html" %}
{% block title %}404 - Not Found{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="badge bg-warning p-3 rounded-circle mb-3"><i class="bi bi-question-circle fs-1 text-dark"></i></div>
    <h2 class="fw-bold">404 - Page Not Found</h2>
    <p class="text-muted">The requested complaint, asset, or page could not be located in Community Connect.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i> Return Home</a>
  </div>
</div>
{% endblock %}
