{% extends "base.html" %}
{% block title %}403 - Forbidden{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 text-center">
    <div class="badge bg-danger p-3 rounded-circle mb-3"><i class="bi bi-shield-x fs-1"></i></div>
    <h2 class="fw-bold">403 - Access Forbidden</h2>
    <p class="text-muted">You do not have administrative or role-based permission to view this resource.</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary mt-2"><i class="bi bi-house me-1"></i> Return Home</a>
  </div>
</div>
{% endblock %}
